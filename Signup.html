<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bus Booking - Sign Up</title>

    <link rel="stylesheet" href="Signup.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <div class="row signup-page">

        <!-- LEFT SIDE - SIGN UP FORM -->
        <div class="col-lg-6 col-md-6 col-12 signup-left">

            <div class="signup-form">

                <h1>Welcome Bus Booking</h1>
                <p class="subtitle">Sign up your account</p>

                <div class="input-box">
                    <label>Full name *</label>
                    <input type="text" placeholder="Enter your full Name">
                </div>

                <div class="input-box">
                    <label>Email *</label>
                    <input type="email" placeholder="Your Email">
                </div>

                <div class="input-box">
                    <label>User Name *</label>
                    <input type="text" placeholder="Enter User Name">
                </div>

                <div class="input-box">
                    <label>Password *</label>
                    <input type="password" placeholder="Enter password">
                </div>

                <button class="signup-btn" type="submit">
                    Sign Up
                </button>

                <p class="login-text">
                    Already have an account?
                    <a href="/login.html">Sign in</a>
                </p>

                <button class="home-btn" type="button">
                    Back to Home
                </button>

            </div>

        </div>


        <!-- RIGHT SIDE - BUS IMAGE -->
        <div class="col-lg-6 col-md-6 col-12 image-side">

            <img src="img/bus photo.png" alt="Bus Booking">

        </div>

    </div>

</body>

</html>
